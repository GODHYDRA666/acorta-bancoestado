<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/png" href="favicon.png">
    <title>Banco Estado</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #ffffff 0%, #fef5f0 50%, #fff9f5 100%);
            overflow: hidden;
            min-height: 100vh;
        }

        .background-accent-1 {
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 140, 0, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            top: -150px;
            right: -150px;
            z-index: 0;
            pointer-events: none;
        }

        .background-accent-2 {
            position: fixed;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(2, 87, 160, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -100px;
            left: -100px;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            text-align: center;
            max-width: 460px;
            width: 100%;
            padding: 20px;
            z-index: 1;
            position: relative;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 60px 45px;
            box-shadow: 0 12px 40px rgba(255, 140, 0, 0.12), 0 4px 16px rgba(0, 0, 0, 0.08);
            animation: slideUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 2px solid rgba(255, 140, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #0257a0 0%, #ff8c00 50%, #0257a0 100%);
            background-size: 200% 100%;
            animation: gradientShift 3s ease-in-out infinite;
        }

        /* LOGO */
        .logo-section {
            margin-bottom: 42px;
            position: relative;
        }

        .logo-container {
            width: 140px;
            height: 140px;
            margin: 0 auto 20px;
            border-radius: 24px;
            overflow: hidden;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: slideDown 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: none;
            padding: 0;
            position: relative;
        }

        .logo-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0) 100%);
            pointer-events: none;
            border-radius: 24px;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: relative;
            z-index: 1;
        }

        /* ANILLO PULSANTE */
        .pulse-ring {
            position: absolute;
            width: 165px;
            height: 165px;
            border: 2px solid rgba(255, 140, 0, 0.4);
            border-radius: 24px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulseFade 2s ease-out infinite;
        }

        /* INDICADOR DE CARGA */
        .progress-bar {
            margin-bottom: 40px;
            height: 6px;
            background: linear-gradient(90deg, #f0f3f7 0%, #fef5f0 50%, #f0f3f7 100%);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 40%;
            background: linear-gradient(90deg, 
                transparent 0%, 
                #ff8c00 40%, 
                #0257a0 50%, 
                #ff8c00 60%, 
                transparent 100%);
            animation: progressMove 2.5s ease-in-out infinite;
            border-radius: 3px;
            box-shadow: 0 0 10px rgba(255, 140, 0, 0.5);
        }

        /* CONTENIDO DE ESTADO */
        .status-content {
            margin-bottom: 32px;
        }

        .main-text {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #0257a0 0%, #ff8c00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.3px;
            margin-bottom: 10px;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        .sub-text {
            font-size: 14px;
            color: #6b7280;
            font-weight: 500;
            letter-spacing: 0.2px;
            animation: fadeIn 0.8s ease-out 0.3s both;
        }

        .dots {
            display: inline-block;
            width: 4px;
            animation: dotsAnimation 1.4s steps(4, end) infinite;
        }

        /* INFORMACIÓN DE SEGURIDAD */
        .security-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 140, 0, 0.15);
            font-size: 13px;
            color: #6b7280;
            animation: fadeIn 0.8s ease-out 0.4s both;
        }

        .status-indicator {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #10b981;
            animation: statusPulse 2s infinite;
            margin-right: 4px;
        }

        /* ANIMACIONES */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes pulseFade {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.3);
            }
        }

        @keyframes progressMove {
            0% {
                left: -100%;
            }
            100% {
                left: 100%;
            }
        }

        @keyframes dotsAnimation {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
            100% { content: ''; }
        }

        @keyframes statusPulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        @keyframes gradientShift {
            0%, 100% {
                background-position: 0% center;
            }
            50% {
                background-position: 100% center;
            }
        }

        /* RESPONSIVE */
        @media (max-width: 480px) {
            .card {
                padding: 45px 30px;
                border-radius: 20px;
                margin: 0 10px;
            }

            .main-text {
                font-size: 18px;
            }

            .logo-container {
                width: 120px;
                height: 120px;
                border-radius: 20px;
            }

            .pulse-ring {
                width: 145px;
                height: 145px;
            }

            .container {
                padding: 10px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="background-accent-1"></div>
    <div class="background-accent-2"></div>

    <div class="container">
        <div class="card">
            <div class="logo-section">
                <div class="logo-container">
                    <div class="pulse-ring"></div>
                    <img src="https://emtecgroup.net/wp-content/uploads/2020/06/Banco-Estado.png" alt="BancoEstado">
                </div>
            </div>

            <div class="progress-bar"></div>

            <div class="status-content">
                <div class="main-text">
                    Generando Solicitud<span class="dots"></span>
                </div>
                <div class="sub-text">
                    Procesando información de seguridad
                </div>
            </div>

            <div class="security-footer">
                <span class="status-indicator"></span>
                <span>Conexión segura encriptada</span>
            </div>
        </div>
    </div>
